<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Exploration Board</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f4f4f2;
      --panel: #ffffff;
      --text: #171717;
      --muted: #717171;
      --line: #d8d8d4;
      --soft: #ecece8;
      --radius: 10px;
      font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
    }

    body { padding: 0 0 72px; }

    .workspace-bar {
      position: sticky;
      top: 0;
      z-index: 20;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      min-height: 48px;
      padding: 9px 18px;
      background: color-mix(in srgb, var(--bg) 92%, transparent);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }

    .workspace-title {
      min-width: 0;
      font-size: 13px;
      font-weight: 650;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .workspace-meta {
      flex: none;
      color: var(--muted);
      font-size: 12px;
    }

    main {
      width: max-content;
      min-width: 100%;
      padding: 28px;
    }

    .baseline,
    .round {
      margin-bottom: 40px;
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      gap: 10px;
      margin-bottom: 14px;
    }

    .section-kicker {
      font-size: 11px;
      line-height: 1;
      font-weight: 750;
      letter-spacing: 0.09em;
      text-transform: uppercase;
    }

    .section-note {
      color: var(--muted);
      font-size: 12px;
      max-width: 820px;
    }

    .variants {
      display: flex;
      align-items: flex-start;
      gap: 18px;
    }

    .variant-card {
      width: max-content;
      max-width: min(92vw, 1320px);
    }

    .variant-head {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 8px 10px;
      align-items: baseline;
      margin-bottom: 8px;
    }

    .variant-id {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 30px;
      height: 22px;
      padding: 0 7px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--panel);
      font-size: 11px;
      font-weight: 750;
      letter-spacing: 0.04em;
    }

    .variant-name {
      font-size: 13px;
      font-weight: 650;
    }

    .variant-parent {
      grid-column: 2;
      color: var(--muted);
      font-size: 11px;
    }

    .prototype-shell {
      overflow: hidden;
      position: relative;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
    }

    .prototype-stage {
      position: relative;
      transform-origin: top left;
    }

    iframe {
      display: block;
      border: 0;
      background: #fff;
    }

    .notes {
      margin-top: 10px;
      width: min(100%, 560px);
      font-size: 12px;
      line-height: 1.45;
    }

    .hypothesis {
      margin: 0 0 5px;
      font-weight: 650;
    }

    .rationale {
      margin: 0;
      color: #454545;
    }

    details {
      margin-top: 7px;
      color: var(--muted);
    }

    summary {
      cursor: pointer;
      user-select: none;
      font-size: 11px;
    }

    .tradeoffs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 7px;
      padding-top: 7px;
      border-top: 1px solid var(--soft);
      color: #4f4f4f;
    }

    .tradeoffs h4 {
      margin: 0 0 3px;
      color: var(--muted);
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .tradeoffs ul {
      margin: 0;
      padding-left: 16px;
    }

    .empty,
    .error {
      padding: 24px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      color: var(--muted);
      font-size: 13px;
    }

    @media (max-width: 760px) {
      main { padding: 18px; }
      .workspace-bar { padding-inline: 12px; }
      .variants { gap: 14px; }
    }
  </style>
</head>
<body>
  <header class="workspace-bar">
    <div class="workspace-title" id="workspace-title">Design exploration</div>
    <div class="workspace-meta" id="workspace-meta">Loading…</div>
  </header>

  <main id="board">
    <div class="empty">Loading <code>exploration.json</code>…</div>
  </main>

  <script>
    const DEFAULT_VIEWPORT = { width: 390, height: 844, scale: 0.72 };

    function esc(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#039;');
    }

    function viewportFor(item, manifest) {
      return {
        ...DEFAULT_VIEWPORT,
        ...(manifest.defaults?.viewport || {}),
        ...(item?.viewport || {})
      };
    }

    function tradeoffList(title, values = []) {
      if (!values.length) return '';
      return `
        <div>
          <h4>${esc(title)}</h4>
          <ul>${values.map(v => `<li>${esc(v)}</li>`).join('')}</ul>
        </div>`;
    }

    function prototypeCard(item, manifest, { baseline = false } = {}) {
      const vp = viewportFor(item, manifest);
      const scale = Number(vp.scale || 1);
      const shellWidth = Math.round(vp.width * scale);
      const shellHeight = Math.round(vp.height * scale);
      const parent = baseline ? '' : (item.parent ? `from ${esc(item.parent)}` : 'root');
      const id = baseline ? (item.label || 'Baseline') : item.id;
      const name = baseline ? '' : item.name;
      const hypothesis = baseline ? (item.problem || '') : item.hypothesis;
      const rationale = baseline
        ? (item.constraints?.length ? `Constraints: ${item.constraints.join(' · ')}` : '')
        : (item.rationale || '');

      return `
        <article class="variant-card" data-variant="${esc(item.id || 'baseline')}">
          <div class="variant-head">
            <span class="variant-id">${esc(id)}</span>
            ${name ? `<span class="variant-name">${esc(name)}</span>` : '<span></span>'}
            ${parent ? `<span class="variant-parent">${parent}</span>` : ''}
          </div>

          <div class="prototype-shell" style="width:${shellWidth}px;height:${shellHeight}px">
            <div class="prototype-stage" style="width:${vp.width}px;height:${vp.height}px;transform:scale(${scale})">
              <iframe
                title="${esc(baseline ? 'Baseline' : `${item.id} ${item.name}`)}"
                src="${esc(item.file)}"
                width="${vp.width}"
                height="${vp.height}"
                loading="lazy"
                sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
              ></iframe>
            </div>
          </div>

          ${(hypothesis || rationale || item.gains?.length || item.sacrifices?.length) ? `
            <div class="notes">
              ${hypothesis ? `<p class="hypothesis">${esc(hypothesis)}</p>` : ''}
              ${rationale ? `<p class="rationale">${esc(rationale)}</p>` : ''}
              ${(item.gains?.length || item.sacrifices?.length) ? `
                <details>
                  <summary>Trade-offs</summary>
                  <div class="tradeoffs">
                    ${tradeoffList('Gains', item.gains)}
                    ${tradeoffList('Sacrifices', item.sacrifices)}
                  </div>
                </details>` : ''}
            </div>` : ''}
        </article>`;
    }

    function render(manifest) {
      document.title = `${manifest.title} — Exploration`;
      document.getElementById('workspace-title').textContent = manifest.title || 'Design exploration';
      document.getElementById('workspace-meta').textContent = `${manifest.rounds?.length || 0} round${manifest.rounds?.length === 1 ? '' : 's'}`;

      const blocks = [];

      if (manifest.baseline) {
        blocks.push(`
          <section class="baseline">
            <div class="section-heading">
              <span class="section-kicker">Baseline</span>
            </div>
            <div class="variants">
              ${prototypeCard(manifest.baseline, manifest, { baseline: true })}
            </div>
          </section>`);
      }

      for (const round of (manifest.rounds || [])) {
        const label = round.label || `Round ${round.number}`;
        blocks.push(`
          <section class="round" data-round="${round.number}">
            <div class="section-heading">
              <span class="section-kicker">${esc(label)}</span>
              ${round.feedback ? `<span class="section-note">Feedback: ${esc(round.feedback)}</span>` : ''}
            </div>
            <div class="variants">
              ${(round.variants || []).map(v => prototypeCard(v, manifest)).join('')}
            </div>
          </section>`);
      }

      document.getElementById('board').innerHTML = blocks.length
        ? blocks.join('')
        : '<div class="empty">No exploration rounds yet.</div>';
    }

    fetch('./exploration.json', { cache: 'no-store' })
      .then(response => {
        if (!response.ok) throw new Error(`HTTP ${response.status}`);
        return response.json();
      })
      .then(render)
      .catch(error => {
        document.getElementById('workspace-meta').textContent = 'Manifest unavailable';
        document.getElementById('board').innerHTML = `
          <div class="error">
            Could not load <code>exploration.json</code> (${esc(error.message)}).<br><br>
            Copy this template to <code>board.html</code> beside the exploration manifest and prototype files.
          </div>`;
      });
  </script>
</body>
</html>
